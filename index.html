
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BAINT AIOPs Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b0f14;
  color:#fff;
}

.screen{
  display:none;
  padding:20px;
}
.screen.active{display:block}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.lang button{
  margin-left:6px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.lang .active{background:#00ffa2;color:#000}

.card{
  background:#111822;
  border-radius:12px;
  padding:16px;
  margin-top:20px;
}

button.main{
  width:100%;
  padding:14px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#00ffa2;
  color:#000;
  cursor:pointer;
  margin-top:15px;
}

.task-btn{
  width:100%;
  padding:12px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#151c26;
  color:#fff;
  cursor:pointer;
}

.app-bar{
  font-size:14px;
  opacity:.7;
  margin-bottom:10px;
}

.box{
  background:#0e141d;
  border-radius:8px;
  padding:10px;
  min-height:40px;
  margin-bottom:10px;
}

#education{
  font-size:14px;
  opacity:.85;
  margin-top:10px;
}

#subtitles{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  padding:10px 14px;
  border-radius:8px;
  font-size:14px;
  display:none;
}

#cursor{
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  background:#00ffa2;
  display:none;
}
</style>
</head>

<body>

<div id="home" class="screen active">
  <div class="header">
    <h3>BAINT AIOPs</h3>
    <div class="lang">
      <button id="enBtn" class="active" onclick="setLang('en')">EN</button>
      <button id="zhBtn" onclick="setLang('zh')">中文</button>
    </div>
  </div>

  <div class="card">
    <p id="intro">
      On-device AI Operations system.<br>
      Observe → Explain → Act.
    </p>
    <button class="main" onclick="authorize()">
      Authorize AI Task
    </button>
  </div>
</div>

<div id="tasks" class="screen">
  <h3 id="taskTitle">Select a Task</h3>

  <button class="task-btn" onclick="startTask('study')">
    📘 Study / Assignment Assistance
  </button>

  <button class="task-btn" onclick="startTask('browser')">
    🌐 Browser Automation Demo
  </button>

  <button class="task-btn" onclick="startTask('message')">
    💬 Message Writing Demo
  </button>
</div>

<div id="demo" class="screen">
  <div class="app-bar" id="appBar"></div>
  <div class="box" id="inputBox"></div>
  <div class="box" id="resultBox"></div>
  <div id="education"></div>
</div>

<div id="subtitles"></div>
<div id="cursor"></div>

<script>
let lang="en";

const TEXT={
  intro:{
    en:"On-device AI Operations system.<br>Observe → Explain → Act.",
    zh:"设备端 AI 操作系统。<br>观察 → 解释 → 执行。"
  },
  select:{
    en:"Select a Task",
    zh:"选择任务"
  }
};

const TASKS={
  study:{
    title:{en:"Study Assistant",zh:"学习助手"},
    explain:{
      en:[
        "You authorized a study task",
        "AIOPs will help structure an assignment",
        "It explains before writing",
        "Student remains in control"
      ],
      zh:[
        "您已授权学习任务",
        "AIOPs 将帮助构建作业",
        "先解释 再书写",
        "学生始终掌控"
      ]
    },
    action:{
      input:"Write an introduction about Artificial Intelligence",
      result:{
        en:"Artificial Intelligence refers to systems designed to simulate human intelligence in problem solving, learning, and decision making.",
        zh:"人工智能是指模拟人类在学习、推理和决策中的智能系统。"
      }
    }
  },

  browser:{
    title:{en:"Browser Demo",zh:"浏览器演示"},
    explain:{
      en:[
        "You selected browser automation",
        "AIOPs observes the interface",
        "Then performs visual interaction",
        "No cloud processing"
      ],
      zh:[
        "您选择了浏览器自动化",
        "AIOPs 观察界面",
        "然后进行视觉交互",
        "无需云端处理"
      ]
    },
    action:{
      input:"Search: What is AIOps?",
      result:{
        en:"AIOps combines AI and IT operations to automate system management.",
        zh:"AIOps 将人工智能与 IT 运维结合，实现系统自动化。"
      }
    }
  },

  message:{
    title:{en:"Message Writing",zh:"消息撰写"},
    explain:{
      en:[
        "You selected message assistance",
        "AIOPs drafts text based on intent",
        "User reviews before sending"
      ],
      zh:[
        "您选择了消息辅助",
        "AIOPs 根据意图生成文本",
        "发送前由用户确认"
      ]
    },
    action:{
      input:"Write a polite message to a lecturer",
      result:{
        en:"Hello Sir, I hope you are well. I would like to ask for clarification regarding the assignment deadline.",
        zh:"老师您好，希望您一切安好。我想咨询一下作业截止时间。"
      }
    }
  }
};

function setLang(l){
  lang=l;
  enBtn.classList.toggle("active",l==="en");
  zhBtn.classList.toggle("active",l==="zh");
  intro.innerHTML=TEXT.intro[lang];
  taskTitle.innerText=TEXT.select[lang];
}

function authorize(){
  show("tasks");
}

function startTask(id){
  const t=TASKS[id];
  show("demo");
  appBar.innerText=t.title[lang];
  inputBox.innerText="";
  resultBox.innerText="";
  education.innerHTML="<strong>Education Mode</strong>";
  explainThenAct(t);
}

function explainThenAct(task){
  const text=task.explain[lang].join(". ");
  const sub=document.getElementById("subtitles");
  sub.innerText=text;
  sub.style.display="block";

  if("speechSynthesis"in window){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==="zh"?"zh-CN":"en-US";
    speechSynthesis.speak(u);
  }

  setTimeout(()=>{
    sub.style.display="none";
    perform(task);
  },3500);
}

function perform(task){
  typeText(task.action.input,inputBox,()=>{
    resultBox.innerText=task.action.result[lang];
  });
}

function typeText(text,el,cb){
  let i=0;
  const int=setInterval(()=>{
    el.innerText+=text[i];
    i++;
    if(i>=text.length){
      clearInterval(int);
      cb();
    }
  },80);
}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
